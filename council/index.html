<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serene Council</title>

<!-- ============================================================
     THE ONLY LINE YOU EVER NEED TO CHANGE
     Keep this the same as the one in ../index.html
     ============================================================ -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycby8QAekX_8W8lnX7lPHKUts4Upph41rBVPIMboC6RuCWD-dRoSv9DJuh_mr5CuDjA2XwQ/exec";
</script>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2d55">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Serene Council">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; height: 100%; background: #f8f9fb; }
  @media (prefers-color-scheme: dark) { html, body { background: #0d1322; } }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  #load {
    position: fixed; inset: 0; display: grid; place-items: center; gap: 18px;
    align-content: center; font-family: system-ui, sans-serif; color: #5f6880;
    text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { #load { color: #a0a9c0; } }
  #load img { width: 88px; height: 88px; border-radius: 22px; }
  #load p { margin: 0; font-size: .95rem; }
  #load a { color: inherit; }
</style>
</head>
<body>

<div id="load">
  <img src="icon-192.png" alt="">
  <p>Opening the council dashboard…</p>
  <p id="slow" hidden><a id="direct" href="#">Taking too long? Tap here to open it directly.</a></p>
</div>

<iframe id="app" title="Serene Council" allow="clipboard-write" hidden></iframe>

<script>
(function () {
  var url = APP_URL + '?page=council';
  var f = document.getElementById('app');
  var load = document.getElementById('load');
  document.getElementById('direct').href = url;

  f.addEventListener('load', function () {
    f.hidden = false;
    load.style.display = 'none';
  });
  f.src = url;

  setTimeout(function () {
    if (f.hidden) document.getElementById('slow').hidden = false;
  }, 6000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
