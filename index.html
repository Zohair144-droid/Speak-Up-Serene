<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak Up Serene</title>

<!-- ============================================================
     THE ONLY LINE YOU EVER NEED TO CHANGE
     If your Apps Script link ever changes, paste the new one here.
     ============================================================ -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycby8QAekX_8W8lnX7lPHKUts4Upph41rBVPIMboC6RuCWD-dRoSv9DJuh_mr5CuDjA2XwQ/exec";
</script>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd23f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Speak Up Serene">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #fff6dc; }
  @media (prefers-color-scheme: dark) { html, body { background: #15122b; } }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  #load {
    position: fixed; inset: 0; display: grid; place-items: center; gap: 18px;
    align-content: center; font-family: system-ui, sans-serif; color: #4a4a55;
    text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { #load { color: #c9c4d8; } }
  #load img { width: 88px; height: 88px; border-radius: 22px; }
  #load p { margin: 0; font-size: .95rem; }
  #load a { color: inherit; }
</style>
</head>
<body>

<div id="load">
  <img src="icon-192.png" alt="">
  <p>Opening Speak Up Serene…</p>
  <p id="slow" hidden><a id="direct" href="#">Taking too long? Tap here to open it directly.</a></p>
</div>

<iframe id="app" title="Speak Up Serene" allow="clipboard-write" hidden></iframe>

<script>
(function () {
  var page = new URLSearchParams(location.search).get('page');
  var url = APP_URL + (page === 'council' ? '?page=council' : '');

  var f = document.getElementById('app');
  var load = document.getElementById('load');
  document.getElementById('direct').href = url;

  f.addEventListener('load', function () {
    f.hidden = false;
    load.style.display = 'none';
  });
  f.src = url;

  // if Google is slow or blocks framing, offer the direct link
  setTimeout(function () {
    if (f.hidden) document.getElementById('slow').hidden = false;
  }, 6000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
